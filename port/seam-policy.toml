# The port's seam policy (sonarlib docs/porting-model.md, Seam audit; docs/roadmap.md, M6 steps 6h and 10a to 10e). The
# test ac_seam_audit runs sl-seam-audit over the build's compile_commands.json with this policy: every file the build
# compiles that uses GX is listed here. The SDK's GX units are sdk and the port's glue is glue. emu64, which only
# ac_port_reference links, is reference, and so is the GX the frame's seams leave to it
# (port/adapter/jsys_display_reference.c); a file that names GX's types or data or includes its headers and calls
# nothing is types, and fails the audit at its first call; the NES emulator, which the port builds and never starts, is
# unsupported. m_play.c, whose GX calls build the display list the emu64 kit decodes, is list. J2D's two files are
# substituted by the port's seam file on the jsys kit (port/adapter/jsys_j2d.cpp), which uses no GX, and JUTResFont.cpp
# by the font's (port/adapter/jsys_font.cpp), which names GX's texture map type in the game's signatures and calls
# nothing of GX. The frame's display, video and FIFO, JFWDisplay.cpp, JUTVideo.cpp and JUTGraphFifo.cpp, are
# substituted by seam files that name GX's types and call nothing of GX (sonarlib docs/steps/m6-10e.md), and libultra's
# shutdown.c by one that uses no GX. The seam is complete: no file is transitional. A file that starts using GX fails
# the audit until it is listed, and a converted file fails until its entry goes.

[category.GX]
names = "GX"
headers = "dolphin/gx.h dolphin/gx/"

[file.dolphin_sdk]
path = "src/static/dolphin/"
category = "GX"
kind = "sdk"
note = "the SDK's units, GX's among them, compiled on the host since step 6f; their bytes go to the port's sink"

[file.port_adapter]
path = "port/adapter/"
category = "GX"
kind = "glue"
note = "the sink, which takes display lists and hands GX written outside them to the reference only, GXInit's bracket, the GX thread, the frame and GX's address space"

[file.m_play]
path = "src/game/m_play.c"
category = "GX"
kind = "list"
note = "copy_efb_to_texture's EFB copy, built into a GX display list that emu64's list calls, which the emu64 kit decodes and records as core's copy (step 10b)"

[file.famicom]
path = "src/static/Famicom/famicom.cpp"
category = "GX"
kind = "unsupported"
note = "the NES emulator's screen and its GX state; unreachable, famicom_init returns -1 under SONAR_PORT, as M6's Scope leaves the NES games out"

[file.jfw_system]
path = "src/static/JSystem/JFramework/JFWSystem.cpp"
category = "GX"
kind = "types"
note = "names the default render mode, GXNtsc480IntDf; includes dolphin/gx.h"

[file.jut_exception]
path = "src/static/JSystem/JUtility/JUTException.cpp"
category = "GX"
kind = "types"
note = "names the render mode and gamma of the exception screen; includes dolphin/gx.h"

[file.jut_xfb]
path = "src/static/JSystem/JUtility/JUTXfb.cpp"
category = "GX"
kind = "types"
note = "sizes the XFBs from a GXRenderModeObj; includes dolphin/gx.h"

[file.jsys_font]
path = "port/adapter/jsys_font.cpp"
category = "GX"
kind = "types"
note = "JUTResFont's seam on the jsys kit: names GXTexMapID in loadFont's and loadImage's signatures and GX_TEXMAP0"

[file.jsys_display]
path = "port/adapter/jsys_display.cpp"
category = "GX"
kind = "types"
note = "JFWDisplay's seam: the frame's clear on the jsys kit; names GXColor and the render mode, and leaves the copy's set-up, preGX's format and clearEfb's quad to the reference's hooks"

[file.jsys_video]
path = "port/adapter/jsys_video.cpp"
category = "GX"
kind = "types"
note = "JUTVideo's seam: the retrace's copy to the XFB and draw done through the reference's hooks; names the render mode"

[file.jsys_graph_fifo]
path = "port/adapter/jsys_graph_fifo.cpp"
category = "GX"
kind = "types"
note = "JUTGraphFifo's seam: GXInit and the FIFO's base and pointers through the glue (port/gx_sink.h); names GXFifoObj"

[file.jsys_display_reference]
path = "port/adapter/jsys_display_reference.c"
category = "GX"
kind = "reference"
note = "the GX the frame's seams leave to the reference, in ac_port_reference only, under --diff or --reference: the display copy, preGX's format and dither, clearEfb's quad and GX's waits and flushes"

[file.jsyswrap]
path = "src/static/jsyswrap.cpp"
category = "GX"
kind = "types"
note = "names the render mode and GXColor of the JSystem wrapper's display setup"

[file.jsyswrapper_main]
path = "src/static/libjsys/jsyswrapper_main.cpp"
category = "GX"
kind = "types"
note = "names the render mode and GXColor of the wrapper's start-up"

[file.famicom_emu]
path = "src/famicom_emu.c"
category = "GX"
kind = "types"
note = "names GXColor and GXRenderModeObj; includes dolphin/gx.h"

[file.dvderr]
path = "src/static/dvderr.c"
category = "GX"
kind = "types"
note = "includes dolphin/gx.h; its error screen draws through emu64's task"

[file.emu64]
path = "src/static/libforest/emu64/"
category = "GX"
kind = "reference"
note = "the console's emu64, the differential test's reference (step 6j), in ac_port_reference only (step 10a): emu64.c draws through GX, and emu64_utility.c and emu64_print.cpp, which it includes, name GX's types"
